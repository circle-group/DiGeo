name: Release to PyPI

on:
  push:
    tags:
      - '**'
  pull_request:
      types: [opened, synchronize, reopened, edited, labeled]
  workflow_dispatch:

jobs:
  build-package:
    name: Build on ${{ matrix.os }} (Torch ${{ matrix.torch }}, CUDA ${{ matrix.cuda }})
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.event.pull_request.title, 'RELEASE') ||
      contains(github.event.pull_request.labels.*.name, 'build') ||
      contains(github.event.pull_request.labels.*.name, 'test-pypi')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        torch: ["2.9.1", "2.10.0"]
        cuda: [true, false]
        exclude:
          # Exclude CUDA builds for OS/Arch combinations that don't support it
          - os: macos-latest
            cuda: true
          - os: ubuntu-24.04-arm
            cuda: true

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Rename package for TestPyPI
      if: contains(github.event.pull_request.labels.*.name, 'test-pypi')
      shell: bash
      run: |
        # This replaces 'name = "digeo"' with 'name = "digeo-test"'
        # Adjust the filename if you use setup.py instead of pyproject.toml
        sed -i 's/name = "digeo"/name = "digeo-test"/g' pyproject.toml
        echo "Renamed package to digeo-test in pyproject.toml"
        sed -i 's/library_name = "digeo"/library_name = "digeo-test"/g' setup.py
        echo "Renamed package to digeo-test in setup.py"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Free Disk Space
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build cibuildwheel

    - name: Build Linux Wheels
      if: runner.os == 'Linux'
      run: cibuildwheel --output-dir dist
      env:
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ARCHS_LINUX: "auto"
        CIBW_SKIP: "*musl*"
        CIBW_BEFORE_BUILD: >
          rm -rf /opt/python/*/lib/python*/site-packages/nvidia* /opt/python/*/lib/python*/site-packages/torch* /tmp/build-env-* /tmp/pip-* || true &&
          pip install torch==${{ matrix.torch }}
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
          auditwheel repair -w {dest_dir} {wheel} --exclude libtorch* --exclude libc10*

        # Only download CUDA toolkit if matrix.cuda is true
        CIBW_BEFORE_ALL: >
          if [ "${{ matrix.cuda }}" = "true" ]; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y dnf-plugins-core &&
              dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
              dnf -y install cuda-toolkit-12-8 &&
              dnf clean all && rm -rf /var/cache/dnf;
            else
              yum install -y yum-utils &&
              yum-config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel7/x86_64/cuda-rhel7.repo &&
              yum -y install cuda-toolkit-12-8 &&
              yum clean all && rm -rf /var/cache/yum;
            fi &&
            /usr/local/cuda-12.8/bin/nvcc --version;
          else
            echo "CPU-only build. Skipping CUDA toolkit installation.";
          fi

        # Dynamically toggle USE_CUDA and PyTorch index URL
        CIBW_ENVIRONMENT: >
          USE_CUDA=${{ matrix.cuda == true && '1' || '0' }}
          CUDA_HOME=/usr/local/cuda-12.8
          PATH=$PATH:/usr/local/cuda-12.8/bin
          TORCH_CUDA_ARCH_LIST='7.5;8.0;8.6;8.9;9.0+PTX'
          PIP_NO_CACHE_DIR=1
          PIP_EXTRA_INDEX_URL=${{ matrix.cuda == true && 'https://download.pytorch.org/whl/cu128' || 'https://download.pytorch.org/whl/cpu' }}

    - name: Build macOS CPU Wheels
      if: runner.os == 'macOS'
      run: cibuildwheel --output-dir dist
      env:
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ARCHS_MACOS: "x86_64 arm64"
        CIBW_BEFORE_BUILD: "pip install torch==${{ matrix.torch }}"
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
          delocate-wheel -w {dest_dir} {wheel} --exclude libtorch* --exclude libc10* --ignore-missing-dependencies
        CIBW_ENVIRONMENT: "USE_CUDA=0 PIP_NO_CACHE_DIR=1"

    - name: Install CUDA Toolkit on Windows
      if: runner.os == 'Windows' && matrix.cuda == true
      shell: pwsh
      run: |
        # Use the LOCAL installer
        $installerUrl = "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe"
        $installerPath = "$env:TEMP\cuda_installer.exe"

        Write-Host "Downloading CUDA 12.8 local installer..."
        Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

        Write-Host "Running silent installation..."
        Start-Process -FilePath $installerPath -ArgumentList "-s nvcc_12.8 cudart_12.8 visual_studio_integration_12.8" -Wait -NoNewWindow

        # Define the default installation path
        $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"

        Write-Host "Adding CUDA to environment variables..."
        echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
        echo "CUDA_HOME=$cudaPath" >> $env:GITHUB_ENV
        echo "$cudaPath\bin" >> $env:GITHUB_PATH

        # Verify installation
        & "$cudaPath\bin\nvcc.exe" --version

    - name: Build Windows Wheels
      if: runner.os == 'Windows'
      run: cibuildwheel --output-dir dist
      env:
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ARCHS_WINDOWS: "auto"
        CIBW_BEFORE_BUILD: >
          rm -rf /opt/python/*/lib/python*/site-packages/nvidia* /opt/python/*/lib/python*/site-packages/torch* /tmp/build-env-* /tmp/pip-* || true &&
          pip install torch==${{ matrix.torch }} ninja
        CIBW_ENVIRONMENT: >
          USE_CUDA=${{ matrix.cuda == true && '1' || '0' }}
          CUDA_HOME="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
          PATH="$PATH;C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8/bin"
          TORCH_CUDA_ARCH_LIST="7.5;8.0;8.6;8.9;9.0+PTX"
          PIP_NO_CACHE_DIR=1
          PIP_EXTRA_INDEX_URL=${{ matrix.cuda == true && 'https://download.pytorch.org/whl/cu128' || 'https://download.pytorch.org/whl/cpu' }}

    - name: Upload dist artifacts
      uses: actions/upload-artifact@v7
      with:
        # Appends -cuda or -cpu to the folder name so they don't overwrite
        name: python-package-${{ matrix.os }}-torch${{ matrix.torch }}-${{ matrix.cuda == true && 'cuda' || 'cpu' }}
        path: dist/*

  publish-to-pypi:
    name: Publish package to PyPI or Test PyPI
    needs: build-package
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'test-pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/digeo/
    permissions:
      id-token: write

    steps:
    - name: Wait for all tests to succeed
      uses: fountainhead/action-wait-for-check@v1.2.0
      id: wait-for-tests
      with:
        token: ${{ github.token }}
        checkName: report_test
        timeoutSeconds: 1600
        intervalSeconds: 30
        ref: ${{ github.sha }}

    - name: Download dist artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-*
        merge-multiple: true
        path: dist

    - name: Determine PyPI target
      id: pypi_target
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          if [[ $(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH") == *"test-pypi"* ]]; then
            echo "TARGET=testpypi" >> $GITHUB_ENV
          else
            echo "TARGET=pypi" >> $GITHUB_ENV
          fi
        else
          echo "TARGET=pypi" >> $GITHUB_ENV
        fi

    - name: Publish distribution
      if: ${{ success() && steps.wait-for-tests.outputs.conclusion == 'success' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ env.TARGET == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Sign the distribution with Sigstore and upload to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-*
        merge-multiple: true
        path: dist

    - name: Build sdist
      run: pipx run build --sdist --outdir dist

    - name: Verify dist folder
      run: ls -al dist/

    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.2.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        "$GITHUB_REF_NAME"
        --repo "$GITHUB_REPOSITORY"
        --notes ""

    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        "$GITHUB_REF_NAME" dist/**
        --repo "$GITHUB_REPOSITORY"